<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-gray-50 text-gray-800 bg-overlay">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header
            class="bg-white/70 backdrop-blur-md sticky top-0 z-50 shadow-sm py-4 border-b border-white/20 transition-all">
            <div class="container mx-auto px-6 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <span class="text-3xl">🌎</span>
                    <div>
                        <h2 id="card-title" class="text-xl font-bold text-gray-800">World Map</h2>
                        <p id="card-desc" class="text-gray-500 text-xs">Visualize selected countries across the globe.
                        </p>
                    </div>
                </div>
                <div class="flex items-center space-x-4">
                    <select id="lang-select" onchange="changeLanguage(this.value)"
                        class="bg-gray-50 border border-gray-200 text-sm rounded-lg p-2 outline-none">
                        <option value="en">🇺🇸 English</option>
                        <option value="ar">🇸🇦 العربية</option>
                        <option value="zh">🇨🇳 中文 (简体)</option>
                        <option value="da">🇩🇰 Dansk</option>
                        <option value="de">🇩🇪 Deutsch</option>
                        <option value="nl">🇳🇱 Dutch</option>
                        <option value="es">🇪🇸 Español</option>
                        <option value="fr">🇫🇷 Français</option>
                        <option value="hi">🇮🇳 हिन्दी</option>
                        <option value="it">🇮🇹 Italiano</option>
                        <option value="ja">🇯🇵 日本語</option>
                        <option value="ko">🇰🇷 한국어</option>
                        <option value="pt">🇵🇹 Português</option>
                        <option value="ru">🇷🇺 Русский</option>
                        <option value="tr">🇹🇷 Türkçe</option>
                    </select>
                    <button onclick="toggleTheme()"
                        class="p-2 rounded-lg bg-gray-100 hover:bg-gray-200 transition-colors" title="Toggle Dark Mode">
                        <span id="theme-icon">🌙</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main -->
        <main class="flex-grow container mx-auto px-6 py-10 max-w-5xl">
            <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-100">
                <div class="h-1.5 bg-gradient-to-r from-indigo-500 via-purple-600 to-indigo-500"></div>

                <!-- Stats Summary -->
                <div id="stats-summary"
                    class="bg-indigo-50/50 border-b border-indigo-100 p-4 flex flex-wrap gap-4 justify-around text-center">
                    <div>
                        <div class="text-[10px] font-bold text-indigo-400 uppercase tracking-tighter"
                            id="stat-label-total">
                            World</div>
                        <div class="text-xl font-black text-indigo-700" id="stat-total">0%</div>
                    </div>
                    <div class="hidden sm:block h-8 w-px bg-indigo-100"></div>
                    <div class="flex gap-4 overflow-x-auto pb-1 max-w-full no-scrollbar">
                        <div class="flex-shrink-0">
                            <div class="text-[9px] font-bold text-gray-400 uppercase" id="stat-label-africa">Africa
                            </div>
                            <div class="text-xs font-bold text-gray-700" id="stat-africa">0%</div>
                        </div>
                        <div class="flex-shrink-0">
                            <div class="text-[9px] font-bold text-gray-400 uppercase" id="stat-label-americas">Americas
                            </div>
                            <div class="text-xs font-bold text-gray-700" id="stat-americas">0%</div>
                        </div>
                        <div class="flex-shrink-0">
                            <div class="text-[9px] font-bold text-gray-400 uppercase" id="stat-label-asia">Asia</div>
                            <div class="text-xs font-bold text-gray-700" id="stat-asia">0%</div>
                        </div>
                        <div class="flex-shrink-0">
                            <div class="text-[9px] font-bold text-gray-400 uppercase" id="stat-label-europe">Europe
                            </div>
                            <div class="text-xs font-bold text-gray-700" id="stat-europe">0%</div>
                        </div>
                        <div class="flex-shrink-0">
                            <div class="text-[9px] font-bold text-gray-400 uppercase" id="stat-label-oceania">Oceania
                            </div>
                            <div class="text-xs font-bold text-gray-700" id="stat-oceania">0%</div>
                        </div>
                    </div>
                </div>

                <div class="p-8">
                    <form action="/view_map" method="post" target="_blank">
                        <div class="space-y-6">
                            <!-- Controls -->
                            <!-- Actions Toolbar -->
                            <div class="space-y-4 bg-gray-50 p-4 rounded-2xl border border-gray-100">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    <!-- Data Actions -->
                                    <div class="space-y-2">
                                        <label id="label-data"
                                            class="text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center block">Data
                                            Management</label>
                                        <div class="flex gap-2">
                                            <button type="button" onclick="downloadTemplate()"
                                                class="flex-1 flex items-center justify-center gap-2 py-2 bg-white border border-green-200 text-green-700 hover:bg-green-50 rounded-xl transition-all shadow-sm text-xs font-semibold"
                                                id="btn-download" title="Download Excel template with all countries">
                                                📥 Download Template
                                            </button>
                                            <input type="file" id="excel-upload" class="hidden"
                                                onchange="handleFileUpload(this)">
                                            <button type="button"
                                                onclick="document.getElementById('excel-upload').click()"
                                                class="flex-1 flex items-center justify-center gap-2 py-2 bg-white border border-gray-200 text-gray-700 hover:bg-gray-50 rounded-xl transition-all shadow-sm text-xs font-semibold"
                                                id="btn-load" title="Upload your visited countries Excel file">
                                                📄 Load Excel
                                            </button>
                                        </div>
                                    </div>
                                    <!-- View/Selection Actions -->
                                    <div class="space-y-2">
                                        <label id="label-view"
                                            class="text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center block">Selection
                                            & View</label>
                                        <div class="flex gap-2">
                                            <button type="button" onclick="toggleFullscreen()"
                                                class="flex-1 flex items-center justify-center gap-2 py-2 bg-white border border-indigo-200 text-indigo-700 hover:bg-indigo-50 rounded-xl transition-all shadow-sm text-xs font-semibold"
                                                id="btn-fullscreen" title="Show application in full-screen mode">
                                                ⛶ Fullscreen
                                            </button>
                                            <button type="button" onclick="clearSelection()"
                                                class="flex-1 flex items-center justify-center gap-2 py-2 bg-white border border-red-200 text-red-700 hover:bg-red-50 rounded-xl transition-all shadow-sm text-xs font-semibold"
                                                id="btn-clear" title="Remove all selected countries">
                                                ✗ Clear Selection
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Search & Selected Chips -->
                            <div class="space-y-3">
                                <div class="relative">
                                    <input type="text" id="search" oninput="filterCountries()" placeholder="Search..."
                                        class="w-full pl-10 pr-4 py-3 border border-gray-200 rounded-2xl text-sm focus:ring-4 focus:ring-indigo-500/10 focus:border-indigo-500 outline-none transition-all shadow-sm">
                                    <span class="absolute left-4 top-3.5">🔍</span>
                                </div>
                                <div id="active-chips"
                                    class="flex flex-wrap gap-2 min-h-[50px] p-3 bg-gray-50 rounded-2xl border border-dashed border-gray-200">
                                    <span class="text-xs text-gray-400 w-full text-center py-2" id="no-selection">No
                                        selection</span>
                                </div>
                            </div>

                            <!-- Accordion -->
                            <div id="accordion" class="max-h-[32rem] overflow-y-auto pr-2 custom-scrollbar space-y-3">
                                <!-- Dynamic Content -->
                            </div>

                            <!-- Map Settings -->
                            <div class="grid grid-cols-2 gap-4 pt-4 border-t border-gray-100">
                                <div>
                                    <label class="text-xs font-bold text-gray-500 uppercase mb-2 block"
                                        id="label-style">Style</label>
                                    <select name="map_style"
                                        class="w-full text-sm border-gray-200 rounded-lg p-2 bg-gray-50 outline-none">
                                        <option value="CartoDB positron">Light</option>
                                        <option value="OpenStreetMap">Standard</option>
                                        <option value="CartoDB dark_matter">Dark</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-xs font-bold text-gray-500 uppercase mb-2 block"
                                        id="label-color">Color</label>
                                    <input type="color" name="visited_color" value="#3498db"
                                        class="w-full h-9 rounded border border-gray-200 cursor-pointer">
                                </div>
                            </div>

                            <select name="selected_countries" id="country-select" multiple class="hidden"></select>

                            <button type="submit"
                                class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition-all"
                                id="btn-launch" title="Generate and open the interactive map">
                                🚀 Launch Map
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
